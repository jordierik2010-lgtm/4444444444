[package]
name = "engine"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
flate2 = "1"
fs2 = "0.4"
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"
