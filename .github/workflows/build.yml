
name: Build 444CFG TOOL (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Localizar proyecto
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Filter package.json -Recurse -File |
            Where-Object {
              Test-Path (Join-Path $_.DirectoryName "src-tauri")
            } | Select-Object -First 1
          if (-not $file) {
            throw "No se encuentra el proyecto Tauri"
          }
          "PROJECT_DIR=$($file.DirectoryName)" >> $env:GITHUB_ENV

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm install --no-audit --no-fund

      - name: Comprobar TypeScript
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm run typecheck

      - name: Probar motor Rust
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          cargo test -p engine

      - name: Compilar 444CFG TOOL
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm run tauri build

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: 444CFG-TOOL-Instalador
          path: "**/target/release/bundle/nsis/*.exe"
          if-no-files-found: error

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: 444CFG-TOOL-EXE
          path: "**/target/release/cfg444-tool.exe"
          if-no-files-found: error
